plugins {
    id 'com.android.application'
}

android {
    namespace 'com.web2apk.template'
    compileSdk 34

    defaultConfig {
        applicationId "com.web2apk.template"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile file("release-keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "cyberapkpass123"
            keyAlias System.getenv("KEY_ALIAS") ?: "cyberapkkey"
            keyPassword System.getenv("KEY_PASSWORD") ?: "cyberapkpass123"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.10.0'
}
